name: Copy an image by digest

# Copies an image that already exists, every architecture and the same digest, to this repository's package (ghcr.io/<owner>/<repo>) under a
# tag. Used to carry the image the Nuit Cloud platform's DNS replicas run (built here before the repository moved from mgjoyce to the nuit-cloud
# organisation) to the organisation's registry unchanged, without building it again.
on:
  workflow_dispatch:
    inputs:
      source:
        description: "image by digest, e.g. ghcr.io/mgjoyce/unbound-docker-arm64@sha256:..."
        required: true
      tag:
        description: "tag in this repository's package, e.g. recursive-28bd9e6"
        required: true

jobs:
  copy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check the inputs
        env: { SOURCE: "${{ inputs.source }}", TAG: "${{ inputs.tag }}" }
        run: |
          printf '%s' "$SOURCE" | grep -Eq '^[a-z0-9./-]+@sha256:[0-9a-f]{64}$' || { echo "source must be an image by digest"; exit 1; }
          printf '%s' "$TAG" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$' || { echo "not a valid tag"; exit 1; }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy
        env: { SOURCE: "${{ inputs.source }}", TAG: "${{ inputs.tag }}" }
        run: |
          target="ghcr.io/${GITHUB_REPOSITORY,,}:$TAG"
          docker buildx imagetools create -t "$target" "$SOURCE"
          want="${SOURCE#*@}"
          got="$(docker buildx imagetools inspect "$target" --format '{{json .Manifest}}' | jq -r .digest)"
          [ "$want" = "$got" ] || { echo "digest changed: $want -> $got"; exit 1; }
          echo "copied $SOURCE to $target ($got)" >> "$GITHUB_STEP_SUMMARY"
